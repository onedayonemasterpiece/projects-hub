[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "projects-hub"
version = "0.1.57"
description = "Voice-first iterative work on project ideas and documentation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "httpx>=0.28,<1",
  "PyYAML>=6.0,<7",
  "PyJWT[crypto]>=2.10,<3",
  "mcp>=2,<3",
  "live-interaction @ git+https://github.com/onedayonemasterpiece/live-interaction.git@557532aa6277b5fc06424eb171d99e96f1445387",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]