[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "projects-hub"
version = "0.1.33"
description = "Voice-first iterative work on project ideas and documentation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "httpx>=0.28,<1",
  "PyJWT[crypto]>=2.10,<3",
  "mcp>=2,<3",
  "live-interaction @ git+https://github.com/onedayonemasterpiece/live-interaction.git@a86221d6b58eeca3df72d8f32c8d8bf44e126305",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
