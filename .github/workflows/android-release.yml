name: Android release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Full reviewed source SHA with matching Android audio evidence"
        required: true
        type: string
      android_run_id:
        description: "Successful Android run with checkout and full audio receipts"
        required: true
        type: string

permissions:
  contents: read

# RC and future qualified releases keep the same package/version sequence.
concurrency:
  group: projects-hub-android-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'onedayonemasterpiece/projects-hub' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      GH_HOST: github.com
      GH_REPO: onedayonemasterpiece/projects-hub
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ORG_GRADLE_PROJECT_liveInteractionAndroidDir: ${{ github.workspace }}/.dependencies/live-interaction/android
    steps:
      - name: Define this run's temporary signing key path
        run: |
          echo "RC_KEYSTORE_PATH=$RUNNER_TEMP/projects-hub-rc-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.jks" >> "$GITHUB_ENV"
      # Keep the reviewed publisher separate from the selected application tree.
      - name: Checkout release validator
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate explicit dispatch inputs
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          ANDROID_RUN_ID: ${{ inputs.android_run_id }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ANDROID_RUN_ID" =~ ^[1-9][0-9]*$ ]]
      - name: Checkout selected application source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare selected checksum-verified published SDK RC
        run: |
          python scripts/prepare_live_framework.py \
            --manifest source/android/live-interaction-candidate.json \
            --destination .dependencies/live-interaction
      - name: Verify source, complete Android audio and immutable release inputs
        id: qualified
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          ANDROID_RUN_ID: ${{ inputs.android_run_id }}
        run: |
          python scripts/android_release_evidence.py prepare \
            --source source --shared .dependencies/live-interaction \
            --source-sha "$SOURCE_SHA" --run-id "$ANDROID_RUN_ID" \
            --version-code "$GITHUB_RUN_NUMBER" --destination dist \
            --github-output "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Verify pinned production APK and signing certificate before key access
        run: |
          python scripts/android_release_evidence.py verify-reference \
            --receipt dist/release-evidence.json \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - name: Require existing stable signing material
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RC_KEYSTORE_PATH"
      - name: Test and build signed release candidate
        working-directory: source
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.RC_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.qualified.outputs.version_name }}
        run: |
          # The validator reads src/projects_hub/version.py; append -rc.N only.
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          gradle -p android testDebugUnitTest :app:assembleRelease \
            -PversionCodeOverride="$VERSION_CODE" \
            -PversionNameOverride="$VERSION_NAME" --stacktrace
          cp android/app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/projects-hub.apk"
      - name: Verify signed package, version and unchanged production key
        run: |
          python scripts/android_release_evidence.py finish \
            --source source --receipt dist/release-evidence.json \
            --apk dist/projects-hub.apk \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - name: Remove this run's decoded signing key
        if: always()
        run: rm -f -- "$RC_KEYSTORE_PATH"

      - name: Publish the single signed app through its in-app update feed
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ steps.qualified.outputs.build_sha }}
          PRODUCT_VERSION: ${{ steps.qualified.outputs.version_name }}
          TAG: ${{ steps.qualified.outputs.tag }}
        run: |
          python scripts/android_release_evidence.py publication-guard --receipt dist/release-evidence.json
          TITLE="Projects Hub Android ${PRODUCT_VERSION}"
          gh release create "$TAG" \
            dist/projects-hub.apk dist/update.json dist/release-evidence.json \
            --title "$TITLE" --target "$BUILD_SHA" \
            --notes-file dist/release-notes.md --latest
          python scripts/android_release_evidence.py verify-published --receipt dist/release-evidence.json
      - name: Upload RC build and publication evidence
        if: always() && hashFiles('dist/release-evidence.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: projects-hub-rc-build-${{ github.run_number }}
          if-no-files-found: error
          path: |
            dist/projects-hub.apk
            dist/update.json
            dist/release-evidence.json
            dist/release-notes.md
            dist/publication-readback.json
