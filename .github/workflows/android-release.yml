name: Android release

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Install Android SDK 35
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Require stable signing material
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/projects-hub.jks"
          chmod 600 "$RUNNER_TEMP/projects-hub.jks"

      - name: Test and build signed APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/projects-hub.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          VERSION_NAME="0.1.${VERSION_CODE}"
          gradle -p android testDebugUnitTest :app:assembleRelease \
            -PversionCodeOverride="${VERSION_CODE}" \
            -PversionNameOverride="${VERSION_NAME}" \
            --stacktrace
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/projects-hub.apk
          /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner verify --verbose dist/projects-hub.apk

      - name: Build update manifest
        run: |
          export SHA256="$(sha256sum dist/projects-hub.apk | awk '{print $1}')"
          python - <<'PY'
          import json, os
          version_code = int(os.environ["GITHUB_RUN_NUMBER"])
          tag = f"android-v{version_code}"
          payload = {
              "versionCode": version_code,
              "versionName": f"0.1.{version_code}",
              "apkUrl": (
                  "https://github.com/onedayonemasterpiece/projects-hub/releases/download/"
                  f"{tag}/projects-hub.apk"
              ),
              "sha256": os.environ["SHA256"],
              "notes": "Projects Hub Android release " + os.environ["GITHUB_SHA"][:12],
          }
          with open("dist/update.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, ensure_ascii=False, indent=2)
              handle.write("\n")
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v${GITHUB_RUN_NUMBER}"
          TITLE="Projects Hub Android 0.1.${GITHUB_RUN_NUMBER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/projects-hub.apk dist/update.json --clobber
          else
            gh release create "$TAG" \
              dist/projects-hub.apk \
              dist/update.json \
              --title "$TITLE" \
              --notes "Signed Projects Hub Android build from ${GITHUB_SHA}."
          fi
