name: Projects Hub contracts

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q

  pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: web
      - run: npm run test:live-framework
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Install isolated browser test dependency
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.62.1
        working-directory: web
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Theme rendering on desktop and mobile
        run: node tests/theme-browser.mjs
        working-directory: web
