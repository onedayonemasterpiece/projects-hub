name: Android

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "scripts/android_emulator_smoke.sh"
      - "scripts/android_voice_fixture.py"
      - "web/**"
      - "src/projects_hub/live*.py"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "scripts/android_emulator_smoke.sh"
      - "scripts/android_voice_fixture.py"
      - "web/**"
      - "src/projects_hub/live*.py"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_liveInteractionAndroidDir: ${{ github.workspace }}/.dependencies/live-interaction/android
    steps:
      - uses: actions/checkout@v4
      - name: Checkout immutable native voice candidate
        uses: actions/checkout@v4
        with:
          repository: onedayonemasterpiece/live-interaction
          ref: c564f0c44c6fe783fd4932bd4633fada34e05c73
          path: .dependencies/live-interaction
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Install Android SDK 35
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - run: gradle -p android testDebugUnitTest assembleDebug --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      - uses: actions/upload-artifact@v4
        with:
          name: projects-hub-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  emulator-smoke:
    runs-on: ubuntu-24.04
    env:
      ORG_GRADLE_PROJECT_liveInteractionAndroidDir: ${{ github.workspace }}/.dependencies/live-interaction/android
      DISPLAY: ":99"
      QT_QPA_PLATFORM: xcb
      QEMU_AUDIO_DRV: pa
      QEMU_PA_SOURCE: ph_ci_mic.monitor
      QEMU_PA_SINK: ph_ci_speaker
      PULSE_SOURCE: ph_ci_mic.monitor
      PULSE_SINK: ph_ci_speaker
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Checkout immutable native voice candidate
        uses: actions/checkout@v4
        with:
          repository: onedayonemasterpiece/live-interaction
          ref: c564f0c44c6fe783fd4932bd4633fada34e05c73
          path: .dependencies/live-interaction
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build actual web and controlled backend fixture
        run: |
          python -m pip install -e . 'numpy>=2,<3'
          npm ci --prefix web
          npm run build --prefix web
      - name: Configure audible emulator and test certificates
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pulseaudio pulseaudio-utils ffmpeg espeak-ng xvfb openssl libxcb-cursor0
          bash scripts/android_emulator_smoke.sh --prepare
      - name: Enable KVM
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-boot-timeout: 900
          disable-animations: false
          # The headless emulator binary has a Pulse stub: use a real Xvfb display.
          emulator-options: -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none -camera-front none -timezone Etc/UTC
          script: bash scripts/android_emulator_smoke.sh
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-evidence
          if-no-files-found: warn
          path: |
            android/smoke-evidence/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
