name: Android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Install Android SDK 35
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - run: gradle -p android testDebugUnitTest assembleDebug --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      - uses: actions/upload-artifact@v4
        with:
          name: projects-hub-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  emulator-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: |
            set -eu
            gradle -p android assembleDebug --stacktrace
            adb_retry() {
              i=0
              while [ "$i" -lt 20 ]; do
                if adb "$@"; then return 0; fi
                adb start-server >/dev/null 2>&1 || true
                i=$((i + 1))
                sleep 2
              done
              return 1
            }
            adb_retry wait-for-device
            adb_retry install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb_retry shell am start -W -n com.kenigevents.projectshub.debug/com.kenigevents.projectshub.MainActivity
            sleep 3
            PID="$(adb_retry shell pidof com.kenigevents.projectshub.debug | tr -d '\r')"
            test -n "$PID"
            echo "ANDROID_LAUNCH_PASS pid=$PID"
