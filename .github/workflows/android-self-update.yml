name: Android self-update E2E

on:
  pull_request:
    paths:
      - "android/**"
      - "scripts/android_self_update_e2e.py"
      - ".github/workflows/android-self-update.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-update:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-boot-timeout: 900
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -timezone Etc/UTC
          script: python3 scripts/android_self_update_e2e.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
