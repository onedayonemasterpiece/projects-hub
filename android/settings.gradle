pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "ProjectsHubAndroid"
include(":app")

// Composite build from the checksum-verified published SDK archive prepared by
// scripts/prepare_live_framework.py. Qualification is separate from packaging.
def sharedAndroid = providers.gradleProperty("liveInteractionAndroidDir").orNull
if (sharedAndroid) {
    includeBuild(file(sharedAndroid)) {
        dependencySubstitution {
            substitute(module("org.onedayonemasterpiece.live:android-contracts")).using(project(":"))
            substitute(module("org.onedayonemasterpiece.live:android-platform")).using(project(":platform"))
        }
    }
}
